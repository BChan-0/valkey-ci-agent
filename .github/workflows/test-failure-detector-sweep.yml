name: Test Failure Detector

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository to scan (default: this repo owner's valkey)"
        required: false
        type: string
        default: ""
      run_id:
        description: "Specific workflow run ID to analyze (empty = latest completed Daily run)"
        required: false
        type: string
        default: ""
      branch:
        description: "Branch to filter workflow runs (default: unstable)"
        required: false
        type: string
        default: "unstable"
      dry_run:
        description: "Parse and report only, don't create/update issues"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  detect-failures:
    name: "Detect test failures"
    if: >
      (github.event_name == 'workflow_dispatch' ||
      github.repository == 'valkey-io/valkey-ci-agent')
    runs-on: ubuntu-latest
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      # Two token paths: the Valkeyrie bot App upstream, a TARGET_PAT secret on
      # forks. The App token can only be minted for the owner it is installed
      # on, so it cannot open issues on a fork's valkey; forks supply a
      # fine-grained PAT with issues:write + actions:read on the target repo.
      # Exactly one step runs; the first non-empty output is used below.
      - name: Generate GitHub App token
        id: generate-token
        if: ${{ github.repository_owner == 'valkey-io' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: valkey-io
          repositories: valkey
          permission-actions: read
          permission-issues: write
          permission-metadata: read

      - name: Use TARGET_PAT (fork)
        id: generate-token-fork
        if: ${{ github.repository_owner != 'valkey-io' }}
        env:
          TARGET_PAT: ${{ secrets.TARGET_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${TARGET_PAT}" ]]; then
            echo "::error::TARGET_PAT is not set. Running the detector on a fork needs a fine-grained PAT with issues:write and actions:read on the target repository."
            exit 1
          fi
          echo "token=${TARGET_PAT}" >> "$GITHUB_OUTPUT"

      - name: Run test failure detector
        env:
          # Exactly one token step ran; the other yields "". First non-empty wins.
          TARGET_TOKEN: ${{ steps.generate-token.outputs.token || steps.generate-token-fork.outputs.token }}
          # Default to the valkey repo under this repo's owner so a fork scans its
          # own CI runs, which is also the only repo its PAT can post issues to.
          TARGET_REPO: ${{ inputs.repo || format('{0}/valkey', github.repository_owner) }}
          TARGET_BRANCH: ${{ inputs.branch || 'unstable' }}
          RUN_ID: ${{ inputs.run_id || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(
            -m scripts.test_failure_detector.main
            --token "${TARGET_TOKEN}"
            --repo "${TARGET_REPO}"
            --branch "${TARGET_BRANCH}"
            --verbose
          )

          if [[ -n "${RUN_ID}" ]]; then
            args+=(--run-id "${RUN_ID}")
          fi

          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi

          python "${args[@]}"
