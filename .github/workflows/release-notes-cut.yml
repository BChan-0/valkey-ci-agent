# Cut a Valkey release: generate notes all at once + bump version + drain prior RCs.
#
# A maintainer dispatches this with the source branch (e.g. unstable), the target
# version, stage, and urgency. The agent generates the release notes in one shot
# from the labelled PRs in range (Claude via Bedrock) -- there is no accumulated
# ## Unreleased block on any branch -- then promotes them onto the long-running
# release branch as a dated section, bumps src/version.h, and refreshes the
# running contributor list, reusing valkey's own utils/releasetools primitives so
# the format stays authoritative there. It opens one PR for the release branch
# (for review); the source branch is never modified.
#
# Branch model (one long-running branch per minor line):
#   rc1 of M.m.p -> create  pre-release-M.m.p
#   rcN (N>1)     -> continue pre-release-M.m.p (keeps prior RCs' dated notes;
#                    dedup is by graph range back to the last reachable RC tag)
#   ga of M.m.p   -> create  M.m carrying the rc history, delete pre-release-M.m.p
name: Cut Release Notes

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch whose merged PRs are cut into the release, e.g. unstable or 9.1"
        required: true
        type: string
      version:
        description: "Target version MAJOR.MINOR.PATCH, e.g. 9.1.0"
        required: true
        type: string
      stage:
        description: "Release stage: rc1..rcN or ga (rc1 has no prior RC tag, so it
          defaults base_ref to the previous release M.(m-1).0 unless you set base_ref)"
        required: true
        type: string
      urgency:
        description: "Upgrade urgency"
        required: true
        type: choice
        options:
          - LOW
          - MODERATE
          - HIGH
          - CRITICAL
          - SECURITY
      date:
        description: "Release date YYYY-MM-DD (default: today)"
        required: false
        type: string
      contrib_base_ref:
        description: "Contributor range start (default: last tag, else root commit)"
        required: false
        type: string
      base_ref:
        description: "Explicit baseline ref overriding tag resolution (branch/tag/SHA).
          Leave empty for rc2+/ga (uses the nearest RC tag); required-ish for rc1, which
          otherwise auto-defaults to the previous release M.(m-1).0."
        required: false
        type: string
      dry_run:
        description: "Compute and log the cut without pushing or opening PRs"
        required: false
        type: boolean
        default: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    concurrency:
      # One cut per version+stage; a re-run replaces the release branch tip.
      # NOTE: stage is interpolated raw here (GitHub expressions have no lower()),
      # so a dispatch of "RC1" and one of "rc1" land in different groups. They
      # still cut the same line — the prep-branch push is force-with-lease and the
      # PR is reused — so the only effect is that two same-version dispatches
      # differing solely in stage case won't serialize against each other.
      group: release-cut-${{ inputs.version }}-${{ inputs.stage }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      CLAUDE_CODE_USE_BEDROCK: "1"
      CI_AGENT_EVIDENCE_DIR: agent-evidence
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code@2.1.153

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: valkey-io
          repositories: valkey
          # contents:write to push the prep branch and create/delete release
          # lines; pull-requests:write to open the release PR; metadata:read is
          # always required.
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: release-cut-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cut release notes
        shell: bash
        env:
          RELEASE_NOTES_GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_NOTES_REPO: valkey-io/valkey
          RELEASE_NOTES_HEAD_REF: ${{ inputs.source_ref }}
          RELEASE_NOTES_VERSION: ${{ inputs.version }}
          RELEASE_NOTES_STAGE: ${{ inputs.stage }}
          RELEASE_NOTES_URGENCY: ${{ inputs.urgency }}
          RELEASE_NOTES_DATE: ${{ inputs.date || '' }}
          RELEASE_NOTES_CONTRIB_BASE: ${{ inputs.contrib_base_ref || '' }}
          RELEASE_NOTES_BASE_REF: ${{ inputs.base_ref || '' }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_NOTES_HEAD_REF}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid source_ref: ${RELEASE_NOTES_HEAD_REF}" >&2
            exit 1
          fi
          # No leading zeros: "09.1.0" would otherwise pass the gate but canonicalize
          # to "9.1.0" in Python, and a raw value leaking past would desync version.h
          # from the branch name. Match single-zero or no-leading-zero components only.
          if [[ ! "${RELEASE_NOTES_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid version (want MAJOR.MINOR.PATCH, no leading zeros): ${RELEASE_NOTES_VERSION}" >&2
            exit 1
          fi
          # Stage is case-insensitive: lowercase it (RC1/GA/Rc2 -> rc1/ga/rc2)
          # before the gate, and re-export so Python reads one canonical form.
          # The Python layer also lowercases, but normalizing here keeps the gate
          # and every downstream value (version.h, branch names, titles) aligned.
          stage_lc="${RELEASE_NOTES_STAGE,,}"
          if [[ ! "${stage_lc}" =~ ^(ga|rc[1-9][0-9]*)$ ]]; then
            echo "Invalid stage (want ga or rcN): ${RELEASE_NOTES_STAGE}" >&2
            exit 1
          fi
          export RELEASE_NOTES_STAGE="${stage_lc}"
          args=(-m scripts.release_notes.main)
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python "${args[@]}"

      - name: Upload agent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cut-agent-evidence-${{ github.run_id }}
          path: agent-evidence
          if-no-files-found: ignore
          retention-days: 30
